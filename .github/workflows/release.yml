name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    uses: platform-mesh/.github/.github/workflows/job-tag-version.yml@6c3ad03c5a50f649d5d3f45aeb039793816b408d
    permissions:
      contents: read

  build:
    needs: [version]
    uses: platform-mesh/.github/.github/workflows/job-node-test.yml@6c3ad03c5a50f649d5d3f45aeb039793816b408d
    secrets: inherit # zizmor: ignore[secrets-inherit]

  publish:
    needs: [version, build]
    uses: platform-mesh/.github/.github/workflows/job-node-publish.yml@6c3ad03c5a50f649d5d3f45aeb039793816b408d
    secrets: inherit # zizmor: ignore[secrets-inherit]
    permissions:
      contents: read
      id-token: write # Needed for OIDC provenance when publishing to npm
    with:
      version: ${{ needs.version.outputs.version }}
      distTag: ${{ needs.version.outputs.distTag }}
      commitVersion: false
      environment: npmjs:@platform-mesh/portal-server-lib

  github-release:
    needs: [version, publish]
    uses: platform-mesh/.github/.github/workflows/job-github-release.yml@6c3ad03c5a50f649d5d3f45aeb039793816b408d
    permissions:
      contents: write # Needed to create the GitHub release
    with:
      tag: ${{ needs.version.outputs.tag }}
      previousTag: ${{ needs.version.outputs.previousTag }}
      prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
      latest: ${{ needs.version.outputs.latest == 'true' }}
